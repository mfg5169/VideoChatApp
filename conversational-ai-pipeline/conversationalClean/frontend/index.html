<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mock Interview Voice Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-6 space-y-4">
    <div class="space-y-2">
      <div class="text-xl font-semibold">Voice Loop Test</div>
      <div class="text-sm text-gray-600">whisper.cpp VAD: send one utterance (speech start → speech end) per trigger. No overlapping chunks.</div>
    </div>

    <div class="flex gap-2">
      <button id="muteBtn" class="px-4 py-2 rounded bg-gray-400 text-white font-medium">Unmute (mic off)</button>
      <button id="ttsBtn" class="px-4 py-2 rounded bg-gray-200">Speak Text</button>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <div class="font-medium mb-1">Transcript (live)</div>
        <textarea id="transcript" class="w-full h-40 p-2 border rounded" readonly></textarea>
      </div>
      <div>
        <div class="font-medium mb-1">Text to Speak</div>
        <textarea id="speakText" class="w-full h-40 p-2 border rounded">Tell me about a project you're proud of.</textarea>
      </div>
    </div>

    <audio id="player" controls class="w-full"></audio>

    <script>
      const API_BASE = "http://127.0.0.1:8000";

      const TIMESLICE_MS = 250;
      const MIN_SEND_BYTES = 2000;
      const CHUNK_BUFFER_MS = 30000;
      // whisper.cpp VAD: "last 1s quiet vs last 2s" = end of utterance; send that utterance only (no overlap)
      const VAD_WINDOW_MS = 2000;       // compare energy over this window
      const VAD_LAST_MS = 1000;         // "tail" considered for silence (last N ms of window)
      const VAD_POLL_INTERVAL_MS = 200; // check every 200ms
      const VAD_RATIO_THOLD = 0.6;      // trigger when rms_last <= this * rms_all (quiet tail)
      const MIN_RMS_SPEECH = 0.008;     // require some speech in window (avoid trigger on total silence)
      const MIN_UTTERANCE_MS = 400;     // don't send if utterance shorter than this
      const SEND_COOLDOWN_MS = 800;     // min ms between sends (utterance-boundary avoids overlap)

      let sharedMicStream = null;
      let mediaRecorder = null;
      let isMuted = true;
      let audioChunks = [];
      let liveTranscript = "";

      let audioCtx = null;
      let analyser = null;
      let sourceNode = null;
      let vadRaf = null;
      let rmsHistory = [];
      let lastVadCheckMs = 0;
      let lastSendTime = 0;
      let utteranceStartTime = null;    // when current utterance started (speech began)
      let inSpeechLast = false;

      const MIME_TYPE = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : "";

      async function ensureMicStream() {
        if (sharedMicStream) {
          const active = sharedMicStream.getTracks().some(t => t.readyState === "live");
          if (active) return sharedMicStream;
          sharedMicStream = null;
        }
        sharedMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        return sharedMicStream;
      }

      function releaseMic() {
        if (sharedMicStream) {
          sharedMicStream.getTracks().forEach(t => t.stop());
          sharedMicStream = null;
        }
      }

      function nowMs() {
        return performance.now();
      }

      function computeRmsTimeDomain(analyser) {
        const buf = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) {
          const v = (buf[i] - 128) / 128;
          sum += v * v;
        }
        return Math.sqrt(sum / buf.length);
      }

      async function sendUtterance(startTime, endTime) {
        if (!audioChunks.length || !mediaRecorder) return;
        const margin = 80;
        const from = startTime - margin;
        const to = endTime + margin;
        const first = [audioChunks[0].blob];
        const rest = audioChunks.slice(1).filter(x => x.t >= from && x.t <= to).map(x => x.blob);
        const blobs = [...first, ...rest];
        if (blobs.length < 2) return;

        const combined = new Blob(blobs, { type: mediaRecorder.mimeType || "audio/webm" });
        if (combined.size < MIN_SEND_BYTES) return;

        const ext = combined.type.includes("webm") ? "webm" : "dat";
        const fd = new FormData();
        fd.append("audio", new File([combined], `utterance.${ext}`, { type: combined.type }));

        try {
          const res = await fetch(`${API_BASE}/stt_partial?language=en`, { method: "POST", body: fd });
          if (!res.ok) return;
          const data = await res.json();
          const sentence = (data.text || "").trim();
          if (!sentence) return;
          liveTranscript = liveTranscript ? liveTranscript + " " + sentence : sentence;
          document.getElementById("transcript").value = liveTranscript;
        } catch (e) {
          console.error("stt_partial error:", e);
        }
      }

      // Returns { rms_all, rms_last } for the current window, or null
      function getRmsWindow() {
        const now = nowMs();
        const cutoff = now - VAD_WINDOW_MS;
        const tailCutoff = now - VAD_LAST_MS;
        let sumAll = 0, sumLast = 0, nAll = 0, nLast = 0;
        for (const p of rmsHistory) {
          if (p.t < cutoff) continue;
          sumAll += p.rms;
          nAll++;
          if (p.t >= tailCutoff) {
            sumLast += p.rms;
            nLast++;
          }
        }
        if (nAll < 4) return null;
        return {
          rms_all: sumAll / nAll,
          rms_last: nLast ? sumLast / nLast : 0
        };
      }

      // whisper.cpp vad_simple: true when last 1s is quiet relative to last 2s (end of utterance)
      function vadSimpleTrigger() {
        const w = getRmsWindow();
        if (!w || w.rms_all < MIN_RMS_SPEECH) return false;
        return w.rms_last <= VAD_RATIO_THOLD * w.rms_all;
      }

      // true when tail is loud (user is speaking)
      function isSpeechNow() {
        const w = getRmsWindow();
        if (!w || w.rms_all < MIN_RMS_SPEECH) return false;
        return w.rms_last > VAD_RATIO_THOLD * w.rms_all;
      }

      function runVadLoop() {
        if (!analyser) {
          vadRaf = requestAnimationFrame(runVadLoop);
          return;
        }
        const now = nowMs();
        const rms = computeRmsTimeDomain(analyser);
        rmsHistory.push({ t: now, rms });
        const cutoff = now - VAD_WINDOW_MS - 500;
        while (rmsHistory.length && rmsHistory[0].t < cutoff) rmsHistory.shift();

        if (now - lastVadCheckMs >= VAD_POLL_INTERVAL_MS) {
          lastVadCheckMs = now;
          const inSpeech = isSpeechNow();
          if (inSpeech && !inSpeechLast) utteranceStartTime = now;
          inSpeechLast = inSpeech;

          if (now - lastSendTime >= SEND_COOLDOWN_MS && vadSimpleTrigger() && utteranceStartTime != null) {
            const duration = now - utteranceStartTime;
            if (duration >= MIN_UTTERANCE_MS) {
              lastSendTime = now;
              sendUtterance(utteranceStartTime, now - 80).catch(console.error);
            }
            utteranceStartTime = null;
          }
        }
        vadRaf = requestAnimationFrame(runVadLoop);
      }

      async function startPartialRecording() {
        audioChunks = [];
        liveTranscript = "";
        rmsHistory = [];
        lastVadCheckMs = 0;
        lastSendTime = -SEND_COOLDOWN_MS;
        utteranceStartTime = null;
        inSpeechLast = false;
        document.getElementById("transcript").value = "";

        const stream = await ensureMicStream();
        mediaRecorder = new MediaRecorder(stream, MIME_TYPE ? { mimeType: MIME_TYPE } : undefined);

        mediaRecorder.ondataavailable = (e) => {
          if (!e.data || e.data.size === 0) return;
          audioChunks.push({ t: nowMs(), blob: e.data });
          const cutoff = nowMs() - CHUNK_BUFFER_MS;
          while (audioChunks.length > 1 && audioChunks[1].t < cutoff) {
            audioChunks.splice(1, 1);
          }
        };

        mediaRecorder.start(TIMESLICE_MS);

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.2;
        sourceNode = audioCtx.createMediaStreamSource(stream);
        sourceNode.connect(analyser);
        vadRaf = requestAnimationFrame(runVadLoop);
      }

      async function stopPartialRecording(finalPass = true) {
        if (vadRaf) {
          cancelAnimationFrame(vadRaf);
          vadRaf = null;
        }
        try { sourceNode?.disconnect(); } catch {}
        sourceNode = null;
        analyser = null;
        if (audioCtx) {
          try { audioCtx.close(); } catch {}
          audioCtx = null;
        }
        if (finalPass && audioChunks.length && utteranceStartTime != null) {
          await sendUtterance(utteranceStartTime, nowMs());
        }
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
      }

      async function unmute() {
        if (!isMuted) return;
        isMuted = false;
        updateMuteButton();
        await startPartialRecording().catch(e => {
          alert(e);
          isMuted = true;
          updateMuteButton();
        });
      }

      function mute() {
        if (isMuted) return;
        isMuted = true;
        updateMuteButton();
        stopPartialRecording(true).catch(console.error);
      }

      function updateMuteButton() {
        const btn = document.getElementById("muteBtn");
        if (isMuted) {
          btn.textContent = "Unmute (mic off)";
          btn.className = "px-4 py-2 rounded bg-gray-400 text-white font-medium";
        } else {
          btn.textContent = "Mute (mic on)";
          btn.className = "px-4 py-2 rounded bg-red-500 text-white font-medium";
        }
      }

      async function speakText() {
        const text = document.getElementById("speakText").value.trim();
        if (!text) return;
        const res = await fetch(`${API_BASE}/tts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, length_scale: 0.94 }),
        });
        if (!res.ok) throw new Error(await res.text());
        const blob = new Blob([await res.arrayBuffer()], { type: "audio/wav" });
        const player = document.getElementById("player");
        player.src = URL.createObjectURL(blob);
        await player.play();
      }

      document.getElementById("muteBtn").addEventListener("click", () => {
        if (isMuted) unmute();
        else mute();
      });
      document.getElementById("ttsBtn").addEventListener("click", () => speakText().catch(e => alert(e)));
      window.addEventListener("beforeunload", () => { stopPartialRecording(false); releaseMic(); });
    </script>
  </body>
</html>
