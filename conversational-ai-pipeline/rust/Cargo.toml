[package]
name = "model-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "model_runtime"
path = "src/lib.rs"

[[bin]]
name = "model_runtime_example"
path = "src/main.rs"

[dependencies]
# Core ML framework
candle-core = "0.4"
candle-nn = "0.4"
candle-transformers = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# File I/O and paths
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"

# Tensor operations
ndarray = "0.15"
safetensors = "0.4"

# Async runtime
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
dirs = "5.0"
pathdiff = "0.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "inference_bench"
harness = false

