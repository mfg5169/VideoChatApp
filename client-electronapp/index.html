<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoChat - Loading...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 18px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading VideoChat...</div>
  </div>

  <script>
    console.log('🚀 MAIN INDEX.HTML LOADED - Console test');
    console.log('🚀 Current time:', new Date().toISOString());
    console.log('🚀 Current URL:', window.location.href);
    
    const DockerUrl = 'http://localhost:8081';
    
    async function checkAuthAndRedirect() {
      console.log('🔍 Checking authentication and redirecting...');
      try {

        const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
        const userData = localStorage.getItem('userData');
        
        console.log('🔍 Auth check - Token exists:', !!token);
        console.log('🔍 Auth check - User data exists:', !!userData);
        
        await new Promise(resolve => setTimeout(resolve, 1000));
        
        if (token && userData) {
          console.log('🔍 User authenticated, redirecting to home');
          window.location.href = './home/index.html';
        } else {
          console.log('🔍 User not authenticated, redirecting to signin');
          window.location.href = './auth/signin/index.html';
        }
      } catch (error) {
        console.error('❌ Error checking authentication:', error);
        window.location.href = './auth/signin/index.html';
      }
    }

    async function checkAuthWithBackend() {
      try {
        const response = await fetch(`${DockerUrl}/api/auth/verify`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('authToken') || sessionStorage.getItem('authToken')}`
          },
          credentials: 'include'
        });

        if (response.ok) {
          window.location.href = './home/index.html';
        } else {
          window.location.href = './auth/signin/index.html';
        }
      } catch (error) {
        console.error('Error checking authentication with backend:', error);
        checkAuthAndRedirect();
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      checkAuthWithBackend();
    });

    setTimeout(() => {
      if (window.location.pathname.includes('index.html')) {
        checkAuthAndRedirect();
      }
    }, 3000);
  </script>
</body>
</html>
